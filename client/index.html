<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Hourly PM2.5 readings from Air4Thai stations across Thailand" />
  <meta name="theme-color" content="#2f5f96" />
  <title>PM2.5 Tracker</title>
  <script>
    try {
      var p = new URLSearchParams(location.search).get('phase')
      if (['morning', 'afternoon', 'evening', 'night'].indexOf(p) < 0) {
        var h = Number(new Intl.DateTimeFormat('en-GB', { timeZone: 'Asia/Bangkok', hour: '2-digit', hourCycle: 'h23' }).format(new Date()))
        p = h >= 5 && h < 11 ? 'morning' : h >= 11 && h < 16 ? 'afternoon' : h >= 16 && h < 19 ? 'evening' : 'night'
      }
      document.documentElement.dataset.phase = p
    } catch (e) { }
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
